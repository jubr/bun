name: slim toolchain
description: Install what a Linux runner needs to build bun, and to cross-compile darwin from it.

inputs:
  rust-targets:
    description: Space-separated rustup targets to add for the pinned nightly, besides the host's.
    default: ""

runs:
  using: composite
  steps:
    # AIDEV-NOTE: scripts/build/ci-images/spec.ts pins LLVM 23.1.x (tools.ts accepts >=23.1.0 <23.1.99), and clang must
    # match the LLVM major of the pinned rustc (23). apt.llvm.org's llvm-toolchain-23 ships it, `all` includes lld
    # (ld64.lld, the Mach-O link of a darwin cross build), llvm-strip and dsymutil, which config.ts requires then.
    - name: Install the toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config golang xz-utils \
          make nasm python3 libtool ruby perl curl lsb-release software-properties-common gnupg zip unzip
        curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        sudo bash /tmp/llvm.sh 23 all
        # llvm-23's bin directory has the unversioned names (clang, ld.lld, llvm-ar, llvm-objdump, ...).
        echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

    - name: Install the pinned Rust nightly
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | head -1)"
        targets=()
        for t in $RUST_TARGETS; do targets+=(--target "$t"); done
        rustup toolchain install "$channel" --profile minimal --component rust-src,llvm-tools "${targets[@]}"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
